{% macro renderTableSearch(practiceTypes) %}
    <table class="table table-hover">
        <thead>
        <tr>
            <th scope="col">
                Numm
            </th>
            <th scope="col" style="text-align:right">
                Aktiounen
            </th>
        </tr>
        </thead>

        <tbody>
        {% for practiceType in practiceTypes %}
            <tr>
                <td>
                    {{ practiceType.name }}
                </td>

                <td style="text-align:right">
                    <a href="{{ url_for('club.practiceTypeView', objectID=practiceType.uid) }}"
                       class="btn btn-sm btn-outline-info">View</a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endmacro %}
