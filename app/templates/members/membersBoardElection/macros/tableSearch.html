{% macro renderTableSearch(memberBoardElections) %}
    <table class="table table-hover">
        <thead>
        <tr>
            <th scope="col">
                Member
            </th>
            <th scope="col">
                Positioun
            </th>
            <th scope="col" style="text-align:right">
                Aktiounen
            </th>
        </tr>
        </thead>

        <tbody>
        {% for memberBoardElection in memberBoardElections %}
            <tr>
                <td>
                    {{ memberBoardElection.member }}
                </td>

                <td>
                    {{ memberBoardElection.boardType }}
                </td>

                <td style="text-align:right">
                    <a href=""
                       class="btn btn-sm btn-outline-info">
                        Virstand
                    </a>
                    <a href=""
                       class="btn btn-sm btn-outline-info">
                        Member
                    </a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endmacro %}
