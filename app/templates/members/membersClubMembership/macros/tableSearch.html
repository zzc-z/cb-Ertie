{% macro renderTableSearch(memberClubMemberships) %}
    <table class="table table-hover">
        <thead>
        <tr>
            <th scope="col">
                Member
            </th>
            <th scope="col">
                Typ
            </th>
            <th scope="col">
                Status
            </th>
            <th scope="col" style="text-align:right">
                Aktiounen
            </th>
        </tr>
        </thead>

        <tbody>
        {% for memberClubMembership in memberClubMemberships %}
            <tr>
                <td>
                    {{ memberClubMembership.member }}
                </td>

                <td>
                    {{ memberClubMembership.membershipType }}
                </td>

                <td>
                    {{ memberClubMembership.active }}
                </td>

                <td style="text-align:right">
                    <a href=""
                       class="btn btn-sm btn-outline-info">
                        Mitgliedschaft
                    </a>
                    <a href=""
                       class="btn btn-sm btn-outline-info">
                        Member
                    </a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endmacro %}
