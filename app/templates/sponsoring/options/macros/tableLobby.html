{% macro renderTableLobby(options) %}
    <table class="table table-hover">
        <thead>
        <tr>
            <th scope="col">
                Numm
            </th>
            <th scope="col" style="text-align:center">
                Wäert
            </th>
            <th scope="col" style="text-align:center">
                Limit
            </th>
            <th scope="col" style="text-align:right">
                Aktiounen
            </th>
        </tr>
        </thead>

        <tbody>
        {% for option in options %}
            <tr>
                <td>
                    {{ option.name }}
                </td>
                <td style="text-align:center">
                    {{ option.value | localizeCurrency }}
                </td>
                <td style="text-align:center">
                    {{ option.taken() }} / {{ option.limit }}
                </td>

                <td style="text-align:right">
                    <a href="{{ url_for('sponsoring.optionView', objectID=option.uid) }}"
                       class="btn btn-sm btn-outline-info">View</a>
                    <a href="{{ url_for('sponsoring.optionEdit', objectID=option.uid) }}"
                       class="btn btn-sm btn-outline-warning">Edit</a>
                    <a href="{{ url_for('sponsoring.optionDelete', objectID=option.uid) }}"
                       class="btn btn-sm {% if (option.sponsors | count) + (option.boni | count) > 0 %}
                                            btn-secondary disabled
                                         {% else %} btn-outline-danger
                                         {% endif %}">Del</a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endmacro %}
