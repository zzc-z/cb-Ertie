{% macro renderTableSearch(sponsors) %}
    <table class="table table-hover">
        <thead>
        <tr>
            <th scope="col">
                Sponsor
            </th>
            <th scope="col" style="text-align:center">
                Kontakt
            </th>
            <th scope="col" style="text-align:right">
                Aktiounen
            </th>
        </tr>
        </thead>

        <tbody>
        {% for sponsor in sponsors %}
            <tr>
                <td>
                    {{ sponsor.name }}
                </td>
                <td>
                    {{ sponsor.member }}
                </td>

                <td style="text-align:right">
                    <a href="{{ url_for('sponsoring.sponsorView', objectID=sponsor.uid) }}"
                       class="btn btn-sm btn-outline-info">View</a>
                    <a href="{{ url_for('sponsoring.sponsorEdit', objectID=sponsor.uid) }}"
                       class="btn btn-sm btn-outline-warning">Edit</a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endmacro %}
