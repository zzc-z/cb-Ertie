 {% macro renderTableSponsor(invoices) %}
    <table class="table table-hover">
        <thead>
        <tr>
            <th scope="col">
                Rechnungssnummer
            </th>
            <th scope="col" style="text-align:center">
                Erstallt / Verschéckt
            </th>
            <th scope="col" style="text-align:center">
                Bezuelt
            </th>
            <th scope="col" style="text-align:right">
                Aktiounen
            </th>
        </tr>
        </thead>

        <tbody>
        {% for invoice in invoices %}
            <tr>
                <td>
                    {{ invoice.number }}
                </td>
                <td scope="col" style="text-align:center">
                    {{ invoice.date | localizeDate }}
                </td>
                <td scope="col" style="text-align:center">
                    {{ invoice.payment | localizeDate }}
                </td>

                <td style="text-align:right">
                    <a href="{{ url_for('invoices.invoiceView', objectID=invoice.uid) }}"
                       class="btn btn-sm btn-outline-info">View</a>
                    <a href="{{ url_for('invoices.invoiceEdit', objectID=invoice.uid) }}"
                       class="btn btn-sm btn-outline-warning">Edit</a>
                    <a href=""
                       class="btn btn-sm btn-outline-success">Bezuelt</a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endmacro %}
