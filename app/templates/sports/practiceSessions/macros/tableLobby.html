{% macro renderTableLobby(practiceSessions) %}
    <table class="table table-hover">
        <thead>
        <tr>
            <th scope="col">
                Kategorie
            </th>
            <th scope="col">
                Datum
            </th>
            <th scope="col">
                Vu
            </th>
            <th scope="col">
                Bis
            </th>
            <th scope="col" style="text-align:right">
                Aktiounen
            </th>
        </tr>
        </thead>

        <tbody>
        {% for practiceSession in practiceSessions %}
            <tr>
                <td>
                    {{ practiceSession.practiceType }}
                </td>
                <td>
                    {{ practiceSession.date | localizeDate }}
                </td>
                <td>
                    {{ practiceSession.start }}
                </td>
                <td>
                    {{ practiceSession.end }}
                </td>

                <td style="text-align:right">
                    <a href="{{ url_for('sports.practiceSessionView', objectID=practiceSession.uid) }}"
                       class="btn btn-sm btn-outline-info">View</a>
                    <a href="{{ url_for('sports.practiceSessionEdit', objectID=practiceSession.uid) }}"
                       class="btn btn-sm btn-outline-warning">Edit</a>
                    <a href="{{ url_for('sports.practiceSessionDelete', objectID=practiceSession.uid) }}"
                       class="btn btn-sm btn-outline-danger">Del</a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endmacro %}
