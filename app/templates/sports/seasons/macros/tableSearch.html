{% macro renderTableSearch(seasons) %}
    <table class="table table-hover">
        <thead>
        <tr>
            <th scope="col">
                Key
            </th>
            <th scope="col">
                Numm
            </th>
            <th scope="col" style="text-align:right">
                Aktiounen
            </th>
        </tr>
        </thead>

        <tbody>
        {% for season in seasons %}
            <tr>
                <td>
                    {{ season.key }}
                </td>
                <td>
                    {{ season.name }}
                </td>

                <td style="text-align:right">
                    <a href="{{ url_for('sports.seasonView', objectID=season.uid) }}"
                       class="btn btn-sm btn-outline-info">View</a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endmacro %}
